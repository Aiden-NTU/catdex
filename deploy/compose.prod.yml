name: catdex

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  nakama:
    build:
      context: ../nakama
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CATDEX_ENROLLMENT_SECRET: ${CATDEX_ENROLLMENT_SECRET:?set CATDEX_ENROLLMENT_SECRET}
      CATDEX_ENROLLMENT_COOLDOWN_SECONDS: ${CATDEX_ENROLLMENT_COOLDOWN_SECONDS:-30}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY}
      NAKAMA_REFRESH_ENCRYPTION_KEY: ${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /nakama/nakama migrate up --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama"
        exec /nakama/nakama \
          --name catdex-nakama \
          --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama" \
          --logger.level INFO \
          --logger.format JSON \
          --session.encryption_key "$${NAKAMA_SESSION_ENCRYPTION_KEY}" \
          --session.refresh_encryption_key "$${NAKAMA_REFRESH_ENCRYPTION_KEY}" \
          --socket.server_key "$${NAKAMA_SERVER_KEY}" \
          --runtime.http_key "$${NAKAMA_RUNTIME_HTTP_KEY}" \
          --console.username "$${NAKAMA_CONSOLE_USERNAME}" \
          --console.password "$${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY}" \
          --metrics.prometheus_port 9100
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose: ["7349", "7350", "7351", "9100"]
    networks: [backend, edge, observability]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CATDEX_DOMAIN: ${CATDEX_DOMAIN:?set CATDEX_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nakama:
        condition: service_healthy
    networks: [edge]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [observability]

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability]

networks:
  backend:
    internal: true
  observability:
    internal: true
  edge:

volumes:
  postgres_data:
  backups:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  grafana_data:
