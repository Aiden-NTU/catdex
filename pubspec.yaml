name: catdex
description: Pokemon Go for cats — geofenced scan, star cards, PvP battles.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  image: ^4.5.4
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  tflite_flutter: ^0.11.0
  uuid: ^4.5.1
  geolocator: ^14.0.0
  permission_handler: ^12.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  http: ^1.4.0
  h3_core: ^1.0.4
  flame: ^1.32.0
  rive: ^0.14.11
  spine_flutter: ^4.3.6
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/breeds.json
    - assets/demo/cat.jpg
    - assets/models/detect.tflite
    - assets/models/detect_labelmap.txt
    - assets/models/oxford_breed.tflite
    - assets/models/oxford_breed_labels.json
    - assets/models/mobilenet_quant.tflite
    - assets/models/imagenet_labels.txt
    - assets/art/battle/
    - assets/audio/battle/
    - assets/battle/spine/cat_tabby/
    - assets/battle/spine/cat_black/
    - assets/battle/spine/owl/
    - assets/battle/spine/raptor/
    - assets/battle/spine/dragon/
    - assets/battle/sprites/gray64/
